[project]
name = "sm-stadsdelen"
version = "0.1.0"
description = "Crawl Amsterdam stadsdeel subsidy pages and enrich JSON records with district labels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stadsdelen"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
