[project]
name = "sm-stadsdelen"
version = "0.1.0"
description = "Crawl Amsterdam stadsdeel subsidy pages and enrich JSON records with district labels."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stadsdelen"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-httpx>=0.36.2",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = [
    "network: live HTTP tests against amsterdam.nl (run with -m network)",
]
